
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love & Flowers 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="flower">🌷</div>
    <h1>Love & Flowers</h1>
    <p class="subtitle">A little love, made just for you 💌</p>

    <section class="card">
      <label for="name">Someone special's name 💕</label>
      <input id="name" placeholder="Enter their name...">

      <label for="message">Write your love message</label>
      <textarea id="message"
        placeholder="You make my world beautiful..."></textarea>

      <div class="buttons">
        <button data-type="flower">🌹 Flowers</button>
        <button data-type="letter">💌 Love Letter</button>
        <button data-type="kiss">💋 Send Kiss</button>
        <button data-type="hug">🫂 Send Hug</button>
      </div>

      <div class="preview" id="preview">
        <div id="emoji">💐</div>
        <h2 id="title">A surprise for you!</h2>
        <p id="result">Choose something lovely above 💗</p>
      </div>

      <button class="whatsapp" id="share">
        💚 Share on WhatsApp
      </button>
    </section>

    <footer>Made with love, just for you ♡</footer>
  </main>

  <div id="floating"></div>
  <script src="script.js"></script>
</body>
</html>
